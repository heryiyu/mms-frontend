# 會員中心的 nginx 設定（frontend/Dockerfile 用）
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Vite build 的檔名帶 hash，可以長期快取
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 這幾個檔案改了要馬上生效（PWA、MSW 的 service worker 與入口頁）
    location ~ ^/(index\.html|sw\.js|registerSW\.js|mockServiceWorker\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA：/callback、/login、/profile 等網址直接開時都回 index.html（取代 vercel.json 的 rewrite）
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
