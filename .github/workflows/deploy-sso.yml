# 部署新的 SSO 登入頁（#47）到 Cloudflare Worker（cloudflare/sso-login/，#43）：main 推送時自動，也可以在 Actions 頁手動執行。
# 需要：secret CLOUDFLARE_API_TOKEN（Cloudflare「Edit Cloudflare Workers」範本建的 token）、variable CLOUDFLARE_ACCOUNT_ID。
# 說明見 cloudflare/sso-login/README.md。
name: Deploy SSO login

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - cloudflare/sso-login/**
      - .github/workflows/deploy-sso.yml
  workflow_dispatch:

permissions:
  contents: read

# 同時只跑一次；main 不取消進行中的部署，避免正式版停在舊 commit
concurrency:
  group: deploy-sso
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_SEND_METRICS: 'false'

jobs:
  worker:
    name: cloudflare worker (nlc-sso-login)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 還沒設定 Cloudflare 時：main 推送只警告並略過（不讓 main 顯示紅叉）；手動執行才報錯
      - name: 檢查 Cloudflare 設定
        id: check
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          msg="缺少 CLOUDFLARE_API_TOKEN secret 或 CLOUDFLARE_ACCOUNT_ID variable，見 cloudflare/sso-login/README.md"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::$msg"
            exit 1
          fi
          echo "::warning::$msg（略過部署）"
          echo "略過部署：$msg" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v5
      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            cloudflare/sso-login/package-lock.json
      # 會員中心網址用 src/sso/paths.ts 的正式預設（member.newlife.org.tw）；要換時在這裡加 env VITE_SSO_MEMBER_CENTER_URL
      - name: build 登入頁（dist-sso）
        if: steps.check.outputs.ready == 'true'
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build:sso
      - name: 部署 Worker
        if: steps.check.outputs.ready == 'true'
        working-directory: cloudflare/sso-login
        run: |
          npm ci --no-audit --no-fund
          npx wrangler deploy
          echo "已部署 nlc-sso-login（MODE 見 cloudflare/sso-login/wrangler.jsonc）" >> "$GITHUB_STEP_SUMMARY"
