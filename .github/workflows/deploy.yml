# 部署到 Vercel（nlc-mms）：main 推送 → 正式版，PR → 預覽版。
# repo 在 GitHub 組織底下且是私有，Vercel 免費版（Hobby）不會從這種 repo 自動部署，所以改由這裡用 Vercel CLI 建置後上傳。
# 需要：secret VERCEL_TOKEN（Vercel 帳號的 token）、variables VERCEL_ORG_ID、VERCEL_PROJECT_ID（Vercel 設定頁的 Team ID、Project ID）。
# 建置設定（Root Directory = frontend、Vite、環境變數）由 vercel pull 從 Vercel 專案設定取得。
name: Deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PR 有新推送時取消舊的那次；main 不取消，避免正式版停在舊 commit
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}
  VERCEL_PROD_FLAG: ${{ github.event_name == 'push' && '--prod' || '' }}

jobs:
  vercel:
    name: vercel (${{ github.event_name == 'push' && 'production' || 'preview' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.event_name == 'push' && 'Production' || 'Preview' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: 檢查 Vercel 設定
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::缺少 VERCEL_TOKEN secret 或 VERCEL_ORG_ID／VERCEL_PROJECT_ID variables，見 .github/workflows/deploy.yml 開頭說明"
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global vercel@62.0.0
      - run: vercel pull --yes --environment="$VERCEL_ENV" --token="$VERCEL_TOKEN"
      - run: vercel build $VERCEL_PROD_FLAG --token="$VERCEL_TOKEN"
      - id: deploy
        run: |
          url=$(vercel deploy --prebuilt $VERCEL_PROD_FLAG --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "部署完成：$url" >> "$GITHUB_STEP_SUMMARY"
