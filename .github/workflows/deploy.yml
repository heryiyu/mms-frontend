# 部署到 GCP Cloud Run（專案 nlc-member-dev、服務 mms-frontend、asia-east1）：main 推送 → 部署新版本。
# PR 不部署，build 檢查由 ci.yml 負責。
# GCP 端的一次性設定（映像庫、帳號、權限）見 docs/gcp-deploy.md。
# 用 Workload Identity Federation 登入 GCP（不存金鑰），需要的 variables：
#   GCP_WIF_PROVIDER  projects/<專案編號>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   GCP_DEPLOY_SA     部署用的 service account 信箱
# 映像 build 時寫進程式的 VITE_* 也放 variables（不是機密，意義見 frontend/.env.example）。
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# 不取消進行中的部署，避免正式版停在舊 commit
concurrency:
  group: deploy-gcp
  cancel-in-progress: false

env:
  PROJECT_ID: nlc-member-dev
  REGION: asia-east1
  SERVICE: mms-frontend
  IMAGE: asia-east1-docker.pkg.dev/nlc-member-dev/mms-frontend/web:${{ github.sha }}

jobs:
  cloud-run:
    name: cloud run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: 檢查 GCP 設定
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
        run: |
          if [ -z "$GCP_WIF_PROVIDER" ] || [ -z "$GCP_DEPLOY_SA" ]; then
            echo "::error::缺少 GCP_WIF_PROVIDER／GCP_DEPLOY_SA variables，見 .github/workflows/deploy.yml 開頭說明"
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet
      - name: Build 映像
        run: |
          docker build -f frontend/Dockerfile -t "$IMAGE" \
            --build-arg VITE_API_BASE_URL="${{ vars.VITE_API_BASE_URL }}" \
            --build-arg VITE_USE_MOCK="${{ vars.VITE_USE_MOCK }}" \
            --build-arg VITE_IDLE_LOGOUT_MINUTES="${{ vars.VITE_IDLE_LOGOUT_MINUTES }}" \
            --build-arg VITE_LOGTO_ENDPOINT="${{ vars.VITE_LOGTO_ENDPOINT }}" \
            --build-arg VITE_LOGTO_APP_ID="${{ vars.VITE_LOGTO_APP_ID }}" \
            --build-arg VITE_LOGTO_RESOURCE="${{ vars.VITE_LOGTO_RESOURCE }}" \
            --build-arg VITE_LOGTO_SCOPES="${{ vars.VITE_LOGTO_SCOPES }}" \
            .
      - run: docker push "$IMAGE"
      - id: deploy
        name: 部署到 Cloud Run
        run: |
          # 公開存取（allUsers 有 run.invoker）是一次性設定，見 docs/gcp-deploy.md；部署帳號沒有改 IAM 的權限
          gcloud run deploy "$SERVICE" --project="$PROJECT_ID" --region="$REGION" \
            --image="$IMAGE" --port=8080 --quiet \
            --service-account="mms-frontend-runtime@$PROJECT_ID.iam.gserviceaccount.com" \
            --max-instances=2 --memory=256Mi
          url=$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "部署完成：$url" >> "$GITHUB_STEP_SUMMARY"
